<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veershree Sales Control</title>
<meta name="theme-color" content="#0C1A2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VS Admin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: navy command sidebar + sticky top bar + card canvas; mobile gets an app-style bottom tab bar */
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #F1F4F8;
  --surface-3: #E8EDF4;
  --ink: #0F1B2D;
  --ink-2: #4A586C;
  --ink-3: #8090A4;
  --line: #E2E8F0;
  --side: #0C1A2C;
  --side-2: #142640;
  --side-ink: #C8D3E2;
  --side-ink-2: #7488A3;
  --accent: #0E8C7A;
  --accent-2: #0A7466;
  --accent-ink: #FFFFFF;
  --accent-soft: #DFF3EF;
  --gold: #B7841F; --gold-soft: #FBF1DC;
  --info: #2F6BD8; --info-soft: #E3ECFC;
  --good: #1D9A57; --good-soft: #E1F5EA;
  --warn: #C27C06; --warn-soft: #FCF0D9;
  --bad: #D24343; --bad-soft: #FCE6E5;
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px; --r-sm: 10px;
  --shadow: 0 1px 2px rgba(15,27,45,.05), 0 8px 24px -12px rgba(15,27,45,.12);
  --shadow-lg: 0 24px 60px -20px rgba(15,27,45,.35);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A111D; --surface: #111B2B; --surface-2: #17233A; --surface-3: #1E2C46; --ink: #E8EEF6; --ink-2: #A9B6C8; --ink-3: #7486A0; --line: #22314A;
    --side: #060C17; --side-2: #0F1A2D; --side-ink: #C8D3E2; --side-ink-2: #6B7F9C;
    --accent: #2DB8A2; --accent-2: #46CBB6; --accent-ink: #04201B; --accent-soft: #10302C;
    --gold: #E2B455; --gold-soft: #33280F; --info: #6C9CF0; --info-soft: #172A4A; --good: #4CCB86; --good-soft: #12301F; --warn: #EAB04A; --warn-soft: #33270F; --bad: #F27272; --bad-soft: #3A1B1D;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A111D; --surface: #111B2B; --surface-2: #17233A; --surface-3: #1E2C46; --ink: #E8EEF6; --ink-2: #A9B6C8; --ink-3: #7486A0; --line: #22314A;
  --side: #060C17; --side-2: #0F1A2D; --side-ink: #C8D3E2; --side-ink-2: #6B7F9C;
  --accent: #2DB8A2; --accent-2: #46CBB6; --accent-ink: #04201B; --accent-soft: #10302C;
  --gold: #E2B455; --gold-soft: #33280F; --info: #6C9CF0; --info-soft: #172A4A; --good: #4CCB86; --good-soft: #12301F; --warn: #EAB04A; --warn-soft: #33270F; --bad: #F27272; --bad-soft: #3A1B1D;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: 24px; font-weight: 800; }
h2 { font-size: 15.5px; font-weight: 700; }
h3 { font-size: 14px; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .tbl td.n, .kpi-v { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.hide { display: none !important; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 15px; height: 15px; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.sb { background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 18px 14px 14px; gap: 6px; overflow-y: auto; }
.sb-brand { display: flex; gap: 11px; align-items: center; padding: 2px 6px 16px; border-bottom: 1px solid rgba(255,255,255,.07); margin-bottom: 8px; }
.logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(140deg, var(--accent) 0%, #0B5E77 100%); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; letter-spacing: -.02em; flex: none; box-shadow: 0 6px 16px -6px rgba(14,140,122,.7); }
.sb-brand .t { font-weight: 800; font-size: 15px; color: #fff; line-height: 1.15; letter-spacing: -.01em; }
.sb-brand .s { font-size: 11.5px; color: var(--side-ink-2); }
.sb-label { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--side-ink-2); padding: 12px 10px 4px; }
.sb-item { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 9px; cursor: pointer; color: var(--side-ink); font-weight: 600; font-size: 13.5px; text-align: left; position: relative; }
.sb-item:hover { background: rgba(255,255,255,.05); color: #fff; }
.sb-item[aria-current="page"] { background: var(--side-2); color: #fff; }
.sb-item[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.sb-item[aria-current="page"] svg { color: var(--accent); }
.sb-item .badge { margin-left: auto; }
.sb-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 8px; }
.sb-user { display: flex; align-items: center; gap: 10px; padding: 6px; }
.sb-user .nm { color: #fff; font-weight: 700; font-size: 13px; }
.sb-user .rl { font-size: 11.5px; color: var(--side-ink-2); }
.sb-theme { display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); color: var(--side-ink); border-radius: 9px; padding: 8px 10px; cursor: pointer; font-weight: 600; font-size: 12.5px; }
.sb-theme:hover { background: rgba(255,255,255,.07); }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 12px 28px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-title { display: none; font-weight: 800; font-size: 16px; }
.top .logo { display: none; width: 32px; height: 32px; font-size: 13px; border-radius: 9px; }
.search { position: relative; flex: 1; max-width: 460px; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px 9px 38px; font-size: 13.5px; }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: var(--font); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--surface-2); }
.dd { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; z-index: 40; }
.dd-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 10px 14px 4px; }
.dd-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 14px; border: 0; background: none; cursor: pointer; text-align: left; }
.dd-item:hover, .dd-item:focus-visible { background: var(--surface-2); }
.dd-item .nm { font-weight: 700; }
.dd-empty { padding: 14px; color: var(--ink-3); font-size: 13px; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.ibtn { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.ibtn:hover { color: var(--ink); background: var(--surface-2); }
.ibtn .dotn { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 800; display: grid; place-items: center; padding: 0 5px; border: 2px solid var(--bg); }
.notif { position: relative; }
.notif .dd { left: auto; right: 0; width: 340px; }
.ni { display: flex; gap: 11px; align-items: flex-start; width: 100%; padding: 11px 14px; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; text-align: left; }
.ni:hover { background: var(--surface-2); }
.ni .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.ni b { font-weight: 700; font-size: 13px; display: block; }
.ni span { font-size: 12px; color: var(--ink-3); }
.content { padding: 24px 28px 64px; max-width: 1400px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head .sub { color: var(--ink-3); font-size: 13px; margin-top: 4px; max-width: 760px; }
.eyebrow { font-size: 11.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 6px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); position: relative; }
.live i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--good); opacity: .35; animation: pulse 1.8s ease-out infinite; }
.live.off i { background: var(--warn); } .live.off i::after { border-color: var(--warn); animation: none; }
@keyframes pulse { from { transform: scale(.6); opacity: .6; } to { transform: scale(1.5); opacity: 0; } }
.banner { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 11px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); margin-bottom: 18px; font-size: 13px; border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.banner b { font-weight: 700; }

/* ---------- Building blocks ---------- */
.grid { display: grid; gap: 18px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { padding: 16px 18px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.card-h .ct { display: flex; align-items: center; gap: 10px; }
.card-h .cic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.card-sub { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.card-b { padding: 0 18px 18px; }
.card-b.flush { padding: 0; }
.note { font-size: 12.5px; color: var(--ink-3); }
.tone-accent { background: var(--accent-soft); color: var(--accent); } .tone-info { background: var(--info-soft); color: var(--info); } .tone-gold { background: var(--gold-soft); color: var(--gold); }
.tone-good { background: var(--good-soft); color: var(--good); } .tone-warn { background: var(--warn-soft); color: var(--warn); } .tone-bad { background: var(--bad-soft); color: var(--bad); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; overflow: hidden; }
.kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpi-l { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.kpi-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.kpi-mid { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.kpi-v { font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.kpi-v small { font-size: 14px; font-weight: 700; color: var(--ink-3); margin-left: 2px; }
.kpi-d { font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 99px; }
.kpi-d.up { background: var(--good-soft); color: var(--good); } .kpi-d.down { background: var(--bad-soft); color: var(--bad); } .kpi-d.flat { background: var(--surface-2); color: var(--ink-3); }
.kpi-s { font-size: 11.5px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.spark { display: block; }

/* Trend chart */
.tc { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px; }
.tc-y { position: relative; height: 200px; }
.tc-y span { position: absolute; right: 0; font-size: 10.5px; color: var(--ink-3); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.tc-plot { position: relative; height: 200px; display: flex; align-items: flex-end; gap: 4px; }
.tc-grid { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); pointer-events: none; }
.tc-col { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; position: relative; border-radius: 6px; z-index: 1; }
.tc-col:hover { background: var(--surface-2); }
.tc-col i { display: block; width: 26%; max-width: 12px; border-radius: 4px 4px 1px 1px; min-height: 2px; }
.tc-col i.s1 { background: var(--accent); } .tc-col i.s2 { background: var(--info); } .tc-col i.s3 { background: var(--gold); }
.tc-col.sel { background: var(--accent-soft); }
.tc-x { display: flex; gap: 4px; margin-left: 36px; margin-top: 6px; }
.tc-x span { flex: 1; text-align: center; font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 11.5px; padding: 6px 9px; border-radius: 7px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 5; font-weight: 600; }
.tc-col:hover .tip { opacity: 1; }

/* Ring */
.ring { position: relative; display: inline-grid; place-items: center; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .rc { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .rc b { font-size: 22px; font-weight: 800; letter-spacing: -.03em; display: block; line-height: 1; }
.ring .rc span { font-size: 10.5px; color: var(--ink-3); font-weight: 600; }

/* Tables */
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl th:first-child { padding-left: 18px; } .tbl td:first-child { padding-left: 18px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 18px; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl th.n, .tbl td.n { text-align: right; }
.tbl tfoot td { font-weight: 800; background: var(--surface-2); border-bottom: 0; border-top: 1px solid var(--line); }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:hover td { background: var(--surface-2); }
.inbar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.inbar .bar { width: 64px; }
.who { display: flex; align-items: center; gap: 9px; min-width: 0; }
.who .t { min-width: 0; }
.who .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.who .sb2 { font-size: 12px; color: var(--ink-3); display: block; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 800; color: #fff; flex: none; letter-spacing: -.02em; }
.av.lg { width: 42px; height: 42px; font-size: 15px; }
.av.xl { width: 52px; height: 52px; font-size: 18px; border-radius: 15px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); } .pill.accent { background: var(--accent-soft); color: var(--accent); } .pill.gold { background: var(--gold-soft); color: var(--gold); }
.pill .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 800; display: inline-grid; place-items: center; }
.badge.soft { background: var(--surface-2); color: var(--ink-3); }
.sb .badge { background: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 7px; background: var(--surface-2); color: var(--ink-2); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.info { background: var(--info-soft); color: var(--info); } .chip.ok { background: var(--surface-2); color: var(--ink-2); }
.chip svg { width: 13px; height: 13px; }
.temp { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; }
.temp i { width: 8px; height: 8px; border-radius: 50%; }
.temp.hot { color: var(--bad); } .temp.hot i { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.temp.warm { color: var(--warn); } .temp.warm i { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.temp.cold { color: var(--info); } .temp.cold i { background: var(--info); box-shadow: 0 0 0 3px var(--info-soft); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink); white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 14px -8px var(--accent); }
.btn.primary:hover { background: var(--accent-2); }
.btn.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, var(--line)); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-3); font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty svg { width: 28px; height: 28px; color: var(--ink-3); opacity: .7; }
.bar { height: 7px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > i { background: var(--good); } .bar.gold > i { background: var(--gold); } .bar.info > i { background: var(--info); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button, .seg label { white-space: nowrap; flex: none; border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; }
.seg button[aria-pressed="true"], .seg label:has(input:checked) { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(15,27,45,.12); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.datenav { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.datenav button { border: 0; background: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); }

.datenav button[disabled] { opacity: .35; cursor: default; }
.datenav .lbl { font-size: 12.5px; font-weight: 700; min-width: 112px; text-align: center; }
.datenav .today { width: auto; padding: 0 10px; font-size: 12px; font-weight: 700; color: var(--accent); }

/* Routine stepper */
.routine { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.rt { display: flex; gap: 11px; align-items: flex-start; padding: 13px 16px; cursor: pointer; text-align: left; border-right: 1px solid var(--line); position: relative; }
.rt:last-child { border-right: 0; }
.rt:hover { background: var(--surface-2); }
.rt.now { background: linear-gradient(180deg, var(--accent-soft), transparent); }

.rt .when { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }

.rt .txt { font-size: 13px; font-weight: 600; display: block; margin-top: 2px; }
.rt input { margin-top: 3px; accent-color: var(--accent); width: 17px; height: 17px; flex: none; cursor: pointer; }
.rt.done .txt { color: var(--ink-3); text-decoration: line-through; }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 10px 14px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .ln { font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--ink); font-size: 13.5px; }
.li .ln:hover { color: var(--accent); }
.li .sub { font-size: 12px; color: var(--ink-3); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.prio { width: 4px; align-self: stretch; border-radius: 4px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); align-items: center; }
.filters input[type="search"] { flex: 1 1 220px; min-width: 0; }
.inp, .filters input, .filters select, .field input, .field select, .field textarea, .tbl select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 11px; min-width: 0; font-size: 13.5px; }
.inp:focus, .filters input:focus, .filters select:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field .lbl { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--ink-3); }
.field textarea { resize: vertical; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fgrid .full { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.toggle { position: relative; display: inline-block; vertical-align: middle; width: 40px; height: 23px; flex: none; }
.toggle input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.toggle span { position: absolute; inset: 0; background: var(--surface-3); border-radius: 99px; transition: background .15s; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle input:checked + span { background: var(--accent); }
.toggle input:checked + span::after { transform: translateX(17px); }
.toggle.warn input:checked + span { background: var(--warn); }
.toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Leads table → cards on phones */

.rtbl td .ph { font-size: 12px; color: var(--ink-3); }

/* Staff cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.scard { border: 1px solid var(--line); border-radius: var(--r); padding: 15px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.scard::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--line); }
.scard.none::before { background: var(--bad); } .scard.ok::before { background: var(--good); } .scard.abs::before { background: var(--ink-3); }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini div { background: var(--surface-2); border-radius: 9px; padding: 7px 10px; }

.entries { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.entries .e { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; }
.entries .e .tm { color: var(--ink-3); font-variant-numeric: tabular-nums; font-weight: 600; }
.entries .e .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 700; font-size: 12.5px; }

/* Funnel & bars */
.funnel { display: flex; flex-direction: column; gap: 6px; }
.fn { display: grid; grid-template-columns: 120px minmax(0, 1fr) 96px; gap: 12px; align-items: center; font-size: 13px; font-weight: 600; }
.fn .track { height: 30px; display: flex; justify-content: center; }
.fn .track i { display: block; height: 100%; border-radius: 7px; min-width: 6px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 70%, var(--info))); }
.fn .val { text-align: right; font-variant-numeric: tabular-nums; }
.fn .val b { font-size: 16px; font-weight: 800; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hb { display: grid; grid-template-columns: minmax(0, 160px) minmax(0, 1fr) 46px; gap: 12px; align-items: center; font-size: 13px; font-weight: 600; }
.hb .track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.hb .track i { display: block; height: 100%; border-radius: 99px; background: var(--bad); }
.hb .track.acc i { background: var(--accent); }
.hb .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }
.rank { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--surface-2); color: var(--ink-2); flex: none; }
.rank.r1 { background: linear-gradient(140deg, #E9C36A, #B7841F); color: #fff; } .rank.r2 { background: linear-gradient(140deg, #C9D2DE, #8E9AAC); color: #fff; } .rank.r3 { background: linear-gradient(140deg, #E4A27A, #A8603A); color: #fff; }

/* Pipeline board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(262px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 9px; min-height: 260px; border: 2px dashed transparent; transition: border-color .12s, background .12s; }
.col.over { border-color: var(--accent); background: var(--accent-soft); }
.col-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 6px; }
.col-h .t { font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.col-h .t i { width: 9px; height: 9px; border-radius: 3px; }
.col-h .c { font-size: 12px; font-weight: 700; color: var(--ink-3); background: var(--surface); border-radius: 99px; padding: 1px 8px; }
.col-sum { font-size: 11.5px; color: var(--ink-3); padding: 0 4px; margin-top: -4px; font-weight: 600; }
.kc { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; cursor: grab; box-shadow: 0 1px 2px rgba(15,27,45,.05); text-align: left; width: 100%; }
.kc:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--shadow); }
.kc.dragging { opacity: .45; }
.kc .nm { font-weight: 700; font-size: 13.5px; }
.kc .pj { font-size: 12px; color: var(--ink-3); }
.kc .ft { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kc .av { width: 24px; height: 24px; font-size: 10px; }
.col-more { font-size: 12px; color: var(--ink-3); text-align: center; padding: 4px; }

/* Stepper */
.stepper { display: flex; align-items: flex-start; gap: 0; }
.st { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; font-size: 10.5px; font-weight: 700; color: var(--ink-3); text-align: center; }
.st::before { content: ""; position: absolute; top: 10px; left: -50%; right: 50%; height: 2px; background: var(--line); z-index: 0; }
.st:first-child::before { display: none; }
.st .c { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 2px solid var(--line); z-index: 1; color: var(--ink-3); }
.st.done { color: var(--ink-2); } .st.done::before { background: var(--accent); }
.st.done .c { background: var(--accent); border-color: var(--accent); color: #fff; }
.st.cur { color: var(--accent); } .st.cur .c { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); color: var(--accent); }
.st.cur::before { background: var(--accent); }
.st .c svg { width: 12px; height: 12px; stroke-width: 3; }
.stepper.lost .st.cur { color: var(--bad); } .stepper.lost .st.cur .c { border-color: var(--bad); box-shadow: 0 0 0 4px var(--bad-soft); color: var(--bad); }

/* Timeline */
.tl { display: flex; flex-direction: column; }
.tl .it { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding-bottom: 14px; position: relative; }
.tl .it::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.tl .it:last-child::before { display: none; }
.tl .dot { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.tl .dot svg { width: 15px; height: 15px; }
.tl .dot.good { background: var(--good-soft); color: var(--good); } .tl .dot.bad { background: var(--bad-soft); color: var(--bad); } .tl .dot.muted { background: var(--surface-2); color: var(--ink-3); } .tl .dot.info { background: var(--info-soft); color: var(--info); } .tl .dot.gold { background: var(--gold-soft); color: var(--gold); }
.tl .h { font-size: 13px; font-weight: 700; padding-top: 2px; }
.tl .m { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
.tl .x { font-size: 13px; color: var(--ink-2); margin-top: 5px; background: var(--surface-2); border-radius: 9px; padding: 7px 10px; }

/* Drawer & modal */
.drawer-back, .modal-back { position: fixed; inset: 0; background: rgba(6,12,22,.5); z-index: 60; display: flex; backdrop-filter: blur(2px); }
.drawer-back { justify-content: flex-end; }
.drawer { width: min(620px, 100%); height: 100%; background: var(--bg); overflow-y: auto; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slidein .18s ease-out; }
@keyframes slidein { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.drawer .dh { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; z-index: 2; }
.drawer .db { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.kv .k { font-size: 11px; color: var(--ink-3); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.kv .v { font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; margin-top: 3px; }
.qa { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.qa .btn { flex-direction: column; gap: 5px; padding: 11px 8px; font-size: 12px; white-space: normal; text-align: center; height: 100%; }
.qa .btn svg { width: 19px; height: 19px; }
.qa .btn.primary svg { color: inherit; }
.qa2 { display: flex; flex-wrap: wrap; gap: 8px; }
.modal-back { align-items: center; justify-content: center; padding: 16px; z-index: 70; }
.modal { width: min(560px, 100%); max-height: calc(100% - 20px); overflow: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: pop .16s ease-out; }
@keyframes pop { from { transform: translateY(8px) scale(.99); opacity: .5; } to { transform: none; opacity: 1; } }
.modal.wide { width: min(760px, 100%); }
.modal header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); gap: 10px; }
.modal .mb { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); }
.merr { margin: 0 18px; padding: 9px 12px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-size: 13px; font-weight: 600; }
.callout { padding: 11px 13px; border-radius: 11px; background: var(--surface-2); font-size: 13px; color: var(--ink-2); }
.callout.warn { background: var(--warn-soft); color: var(--ink); } .callout.accent { background: var(--accent-soft); color: var(--ink); } .callout.bad { background: var(--bad-soft); color: var(--ink); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.split > div { background: var(--surface-2); border-radius: 11px; padding: 10px 12px; }
.split .k { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.split .v { font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 11px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); max-width: 92vw; display: flex; gap: 8px; align-items: center; }
.toast.bad { background: var(--bad); color: #fff; }
.center-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent), var(--bg); }
.center-card { max-width: 470px; width: 100%; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.center-card .brandrow { display: flex; gap: 12px; align-items: center; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: var(--ink-2); }
.ring2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ring2 .lk { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 99px; padding: 4px 10px 4px 4px; font-size: 12.5px; font-weight: 600; }
.ring2 .lk .av { width: 22px; height: 22px; font-size: 9.5px; }
.skel { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: sh 1.4s infinite linear; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }

.ev { font-size: 12.5px; display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 5px 12px; padding: 10px 12px; background: var(--surface-2); border-radius: 11px; max-height: 280px; overflow: auto; }

.setrow { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 24px; padding: 20px 18px; border-top: 1px solid var(--line); }
.setrow:first-child { border-top: 0; }

.hero { display: flex; flex-direction: column; gap: 16px; padding: 20px 22px; border-radius: var(--r); background: linear-gradient(120deg, var(--side) 0%, #12304A 60%, #0E5A5A 100%); color: #fff; box-shadow: var(--shadow); position: relative; overflow: hidden; }

.hero .hs span { font-size: 11.5px; color: #9FB2C8; font-weight: 600; }
.hero .ring .rc b { color: #fff; } .hero .ring .rc span { color: #9FB2C8; }

/* Import */
.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 16px; border: 2px dashed var(--line); border-radius: 14px; background: var(--surface-2); cursor: pointer; text-align: center; }

.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
.vh:focus-visible + * , .drop:focus-within { outline: 2px solid var(--accent); }

/* Staff app */
.logo.staff { background: linear-gradient(140deg, #E5AE45 0%, #B7701F 100%); box-shadow: 0 6px 16px -6px rgba(183,112,31,.7); }
.applink { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }

.applink code { display: block; font-size: 11.5px; color: var(--ink-2); margin-top: 4px; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.sapp { min-height: 100vh; background: var(--bg); }
.s-wrap { max-width: 680px; margin: 0 auto; min-height: 100vh; padding-bottom: 170px; }
.s-top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }

.s-brand { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
.s-main { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.s-main .banner { margin: 0; }
.s-share { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom)); width: min(680px, 100%); padding: 0 12px 10px; z-index: 34; pointer-events: none; }
.s-share .box { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--side); color: #fff; border-radius: 16px; padding: 10px 10px 10px 12px; box-shadow: var(--shadow-lg); }

.s-share .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: rgba(255,255,255,.1); color: #EAB04A; flex: none; }

function leadActions(l, role) {

/* ================= Export ================= */
function csvOf(rows) { return rows.map(r => r.map(v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n'); }
async function exportCsv(filename, rows) {
  const csv = csvOf(rows);
  if (S.mode === 'live' && window.claude && window.claude.use) {
    let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) { try { await dl.save({ filename, data: '﻿' + csv }); toast('Export saved'); } catch (e) { if (e && e.code === 'declined') return; toast('Couldn\'t export the file. Try again.', true); } return; }
  }
  if (S.mode === 'local') { downloadBlob(filename, '\ufeff' + csv, 'text/csv'); toast('Export downloaded'); return; }
  try { await navigator.clipboard.writeText(csv); toast('Copied as CSV. Paste it into Excel or Google Sheets.'); } catch (e) { toast('Export isn\'t available in this view.', true); }
}
function downloadBlob(filename, text, type) {
  const blob = new Blob([text], { type: type || 'application/json' }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function shareOrDownload(filename, text, type) {
  type = type || 'application/json';
  try {
    const file = new File([text], filename, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: filename }); return 'shared'; }
  } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  downloadBlob(filename, text, type); return 'downloaded';
}

  const p = Object.assign({}, patch, { log: log.slice(-200), lastActivityAt: now, updatedAt: now, updatedBy: S.me });

  if (entry && CONTACT_TYPES.includes(entry.t)) { p.lastTouchAt = now; if (!l.firstFollowupAt) { p.firstFollowupAt = now; p.firstFollowupBy = S.me; } }
  await dbUpdate('leads/' + l.id, p);

  S.me = DEMO_IDS[S.demoAs]; S.isOwner = S.demoAs === 'owner'; S.myName = nameOf(S.me);
  S.unsubs.forEach(u => { try { u(); } catch (e) { /* closed */ } });
  startSubs();
}
function startDemo(reason) {
  if (S.mode === 'demo') return;
  S.mode = 'demo';
  S.demoReason = reason || 'Live data isn\'t available in this view.';
  const seed = buildDemoSeed();
  S.store = demoAdapter(seed);
  S.user = { profiles: async ids => { const o = {}; (Array.isArray(ids) ? ids : [ids]).forEach(id => { o[id] = Object.assign({ id, name: '', email: null }, DEMO_PROFILES[id] || {}); }); return o; } };
  S.profiles = Object.assign({}, DEMO_PROFILES);
  S.demoAs = 'owner'; applyDemoIdentity();
  setTimeout(render, 30);
}

/* ================= Boot ================= */
const IDB_NAME = 'veershree-sales-control';
function idbOpen() { return new Promise((res, rej) => { let r; try { r = indexedDB.open(IDB_NAME, 1); } catch (e) { rej(e); return; } r.onupgradeneeded = () => r.result.createObjectStore('docs'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function idbAll(db) { return new Promise((res, rej) => { const out = {}; const rq = db.transaction('docs').objectStore('docs').openCursor(); rq.onsuccess = () => { const c = rq.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); }; rq.onerror = () => rej(rq.error); }); }
function idbWrite(db, path, data) {
  try { const tx = db.transaction('docs', 'readwrite'); const st = tx.objectStore('docs'); if (data == null) st.delete(path); else st.put(data, path); tx.onerror = () => { S.saveError = true; schedule(); }; }
  catch (e) { S.saveError = true; schedule(); }
}
function idbReplace(db, docs) { return new Promise((res, rej) => { const tx = db.transaction('docs', 'readwrite'); const st = tx.objectStore('docs'); st.clear(); Object.entries(docs).forEach(([k, v]) => st.put(v, k)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function startLocal() {
  S.mode = 'local'; let seed = {}; let db = null;
  try { db = await idbOpen(); seed = await idbAll(db); } catch (e) { console.warn('Browser storage unavailable', e); S.saveError = true; }
  S.idb = db; S.store = demoAdapter(seed, db ? (p, d) => idbWrite(db, p, d) : null);
  S.me = 'owner'; S.isOwner = true; S.myName = ''; S.settings = seed['settings/main'] || null;
  startSubs();
  if (!seed['settings/main']) dbSet('settings/main', Object.assign({}, DEFAULT_SETTINGS, { ownerId: 'owner' }));
  setTimeout(render, 30);
}
function backupDownload() {
  if (!S.store || !S.store.dump) return toast('Backup isn\'t available here.', true);
  const text = JSON.stringify({ type: 'veershree-admin-backup', version: 1, at: Date.now(), docs: S.store.dump() });
  downloadBlob(`veershree-admin-backup-${dayKey(Date.now())}.json`, text); lsSet('vsc-last-backup', String(Date.now())); toast('Backup downloaded. Keep it somewhere safe.'); render();
}
function backupRestore() {
  openModal('Restore backup', '<div class="callout warn">Everything in this browser is replaced by the backup.</div><label class="field"><span class="lbl">Backup file</span><input id="rs-file" type="file" accept=".json,application/json,text/plain"></label>', {
    submit: 'Restore', danger: true, onSubmit: async () => {
      const el = $('#rs-file'); if (!el || !el.files || !el.files[0]) return 'Choose the backup file.';
      let d; try { d = JSON.parse(await el.files[0].text()); } catch (e) { return 'This file can\'t be read.'; }
      if (!d || d.type !== 'veershree-admin-backup' || !d.docs) return 'This isn\'t an Admin app backup file.';
      if (S.mode !== 'local' || !S.idb) return 'Restore works only in the saved version of the app.';
      await idbReplace(S.idb, d.docs); location.reload();
    } });
}
async function boot() {
  const th = lsGet('vsc-theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
  const hasRuntime = window.claude && typeof window.claude.use === 'function';
  if (!hasRuntime) return /[?&]demo\b/.test(location.search) ? startDemo('Remove ?demo from the address to use your own data.') : startLocal();
  const fallback = setTimeout(() => { if (S.mode === 'loading') startDemo('Live data didn\'t respond in this view.'); }, 12000);
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { console.warn(e); }
  clearTimeout(fallback);
  if (S.mode !== 'loading') return;
  if (!db) return startDemo('Sign in to Claude to use live team data.');
  S.mode = 'live'; S.store = liveAdapter(db); S.user = user;
  try { const me = user ? await user.me() : null; S.me = me && me.id || null; S.isOwner = !!(me && me.isOwner); S.myName = me && me.name || ''; S.myEmail = me && me.email || null; } catch (e) { console.warn(e); }
  render();
  if (S.me) startSubs();
}
boot();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
